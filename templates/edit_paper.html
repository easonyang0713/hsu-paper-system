<!DOCTYPE html>
<html lang="zh-Hant">
{% extends "base.html" %}

<head>
    <meta charset="UTF-8">
    <title>編輯論文</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

{% block content %}

<body class="bg-light">

<div class="container py-5">
    <h1 class="mb-4">✏️ 編輯論文資料</h1>

    {% if message %}
        <div class="alert alert-success">{{ message }}</div>
    {% endif %}
    {% if error %}
        <div class="alert alert-danger">{{ error }}</div>
    {% endif %}

    <form method="post" enctype="multipart/form-data" class="card p-4 shadow-sm bg-white">
        <div class="mb-3">
            <label for="title" class="form-label">標題</label>
            <input type="text" name="title" id="title" class="form-control" value="{{ paper['title'] }}" required>
        </div>

        <div class="mb-3">
            <label for="authors" class="form-label">作者</label>
            <input type="text" name="authors" id="authors" class="form-control" value="{{ paper['authors'] }}">
        </div>

        <div class="mb-3">
            <label for="abstract" class="form-label">摘要</label>
            <textarea name="abstract" id="abstract" class="form-control" rows="4">{{ paper['abstract'] }}</textarea>
        </div>

        <div class="row g-3">
            <div class="col-md-6">
                <label for="source" class="form-label">出處</label>
                <input type="text" name="source" id="source" class="form-control" value="{{ paper['source'] }}">
            </div>
            <div class="col-md-6">
                <label for="year" class="form-label">發表年份</label>
                <input type="number" name="year" id="year" class="form-control" value="{{ paper['year'] }}">
            </div>
        </div>

        <div class="mb-3 mt-3">
            <label for="keywords" class="form-label">關鍵字</label>
            <input type="text" name="keywords" id="keywords" class="form-control" value="{{ paper['keywords'] }}">
        </div>

		<div class="mb-3">
			<label class="form-label">研究領域（可複選）：</label><br>
			{% for field in existing_fields %}
				<div class="form-check form-check-inline">
					<input class="form-check-input" type="checkbox" 
						   name="fields" value="{{ field.id }}"
						   {% if field.id in selected_field_ids %}checked{% endif %}>
					<label class="form-check-label">{{ field.name }}</label>
				</div>
			{% endfor %}
		</div>


        <div class="mb-3">
            <label for="new_field" class="form-label">新增研究領域（可留空）</label>
            <input type="text" name="new_field" id="new_field" class="form-control">
        </div>

        <div class="mb-3">
            <label for="pdf" class="form-label">替換 PDF 檔案（可選）</label>
            <input type="file" name="pdf" id="pdf" class="form-control" accept=".pdf">
        </div>
		{% if paper['pdf_filename'] %}
			<p class="mt-2">
				📄 目前 PDF：<strong>{{ paper['pdf_filename'] }}</strong>
			</p>
			<div class="form-check mb-3">
				<input class="form-check-input" type="checkbox" name="delete_pdf" id="delete_pdf">
				<label class="form-check-label" for="delete_pdf">
					🗑️ 刪除目前的 PDF
				</label>
			</div>
		{% endif %}

		<div class="form-check mt-3">
		  <input class="form-check-input" type="checkbox" name="is_physical" id="is_physical"
				 {% if paper['is_physical'] == 1 %}checked{% endif %}>
		  <label class="form-check-label" for="is_physical">
			📚 此論文為實體館藏
		  </label>
		</div>

		<div class="mb-3 mt-2">
		  <label for="physical_id" class="form-label">實體書編號</label>
		  <input type="text" class="form-control" name="physical_id" id="physical_id"
				 value="{{ paper['physical_id'] or '' }}">
		</div>

		<script>
		  // 若未勾選實體，不顯示輸入框
		  const checkbox = document.getElementById('is_physical');
		  const inputBlock = document.getElementById('physical_id').parentElement;
		  function toggleInput() {
			inputBlock.style.display = checkbox.checked ? 'block' : 'none';
		  }
		  checkbox.addEventListener('change', toggleInput);
		  toggleInput();  // 初始執行
		</script>

        <div class="d-flex gap-2 mt-3">
            <button type="submit" class="btn btn-primary">儲存變更</button>
            <a href="/admin/papers" class="btn btn-secondary">返回列表</a>
        </div>
    </form>
</div>
</body>
{% endblock %}

</html>
