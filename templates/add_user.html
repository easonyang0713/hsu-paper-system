<!DOCTYPE html>
<html lang="zh-Hant">
{% extends "base.html" %}
<head>
    <meta charset="UTF-8">
    <title>新增用戶</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

{% block content %}


    <div class="container py-5">
        <h1 class="mb-4">➕ 新增用戶</h1>

        {% with messages = get_flashed_messages() %}
          {% if messages %}
            <div class="alert alert-warning" role="alert">
              {{ messages[0] }}
            </div>
          {% endif %}
        {% endwith %}

        <form method="post" class="card p-4 shadow-sm bg-white">
            <div class="mb-3">
                <label for="username" class="form-label">帳號</label>
                <input type="text" class="form-control" id="username" name="username" required>
            </div>
			<div class="mb-3">
			<label for="display_name" class="form-label">顯示名稱</label>
			<input type="text" class="form-control" id="display_name" name="display_name" required>
			</div>

            <div class="mb-3">
                <label for="password" class="form-label">密碼</label>
                <input type="password" class="form-control" id="password" name="password" required>
            </div>

            <div class="mb-3">
                <label for="role" class="form-label">身分</label>
                <select class="form-select" id="role" name="role" required>
                    <option value="user">用戶</option>
                    <option value="admin">管理員</option>
                </select>
            </div>

            <div class="d-flex gap-2 mt-4">
                <button type="submit" class="btn btn-primary">新增用戶</button>
                <a href="/admin/users" class="btn btn-secondary">返回用戶管理</a>
            </div>
        </form>
    </div>
	{% endblock %}

</body>
</html>
