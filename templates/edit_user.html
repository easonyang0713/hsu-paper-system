<!DOCTYPE html>
<html lang="zh-Hant">
{% extends "base.html" %}

<head>
    <meta charset="UTF-8">
    <title>編輯用戶</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

{% block content %}

<body class="bg-light">

<div class="container py-5">
    <h1 class="mb-4">✏️ 編輯用戶：{{ user['username'] }}</h1>

    {% with messages = get_flashed_messages() %}
    {% if messages %}
        <div class="alert alert-warning" role="alert">
            {{ messages[0] }}
        </div>
    {% endif %}
    {% endwith %}

    <form method="post" class="card p-4 shadow-sm bg-white">
        <div class="mb-3">
            <label for="display_name" class="form-label">顯示名稱</label>
            <input type="text" class="form-control" id="display_name" name="display_name" value="{{ user['display_name'] }}" required>
        </div>

        <div class="mb-3">
            <label for="role" class="form-label">角色</label>
            <select class="form-select" id="role" name="role">
                <option value="user" {% if user['role'] == 'user' %}selected{% endif %}>用戶</option>
                <option value="admin" {% if user['role'] == 'admin' %}selected{% endif %}>管理員</option>
            </select>
        </div>

        <div class="mb-3">
            <label for="password" class="form-label">新密碼（若不修改請留空）</label>
            <input type="password" class="form-control" id="password" name="password">
        </div>

        <div class="d-flex gap-2 mt-4">
            <button type="submit" class="btn btn-primary">儲存變更</button>
            <a href="/admin/users" class="btn btn-secondary">返回用戶管理</a>
        </div>
    </form>
</div>
</body>
{% endblock %}

</html>
