{% extends "base.html" %}
{% block content %}

<div class="container py-5">
    <h2 class="mb-4">🔍 進階搜尋</h2>

    <form method="POST">
        <div class="mb-3">
            <label for="keyword" class="form-label">論文標題／作者關鍵字</label>
            <input type="text" class="form-control" id="keyword" name="keyword" placeholder="例如：戰國文字、文字">
        </div>

        <div class="mb-3">
            <label for="keyword_field" class="form-label">📎 論文關鍵字欄位</label>
            <input type="text" class="form-control" id="keyword_field" name="keyword_field" placeholder="輸入關鍵字，例如：莊子、文字學、龍龕手鑑">
        </div>

        <div class="row">
            <div class="col-md-6 mb-3">
                <label for="start_year" class="form-label">起始年份</label>
                <input type="number" class="form-control" name="start_year" id="start_year">
            </div>
            <div class="col-md-6 mb-3">
                <label for="end_year" class="form-label">結束年份</label>
                <input type="number" class="form-control" name="end_year" id="end_year">
            </div>
        </div>

        <div class="mb-3">
            <button class="btn btn-outline-secondary" type="button" data-bs-toggle="collapse" data-bs-target="#fieldCollapse" aria-expanded="false">
                📚 選擇研究領域（可選）
            </button>
            <div class="collapse mt-3" id="fieldCollapse">
                {% if fields %}
                    {% for field in fields %}
                        <div class="form-check form-check-inline">
                            <input class="form-check-input" type="checkbox" name="field" value="{{ field.id }}" id="field{{ field.id }}">
                            <label class="form-check-label" for="field{{ field.id }}">{{ field.name }}</label>
                        </div>
                    {% endfor %}
                {% else %}
                    <p class="text-muted mt-2">目前尚無可選的研究領域</p>
                {% endif %}
            </div>
        </div>

        <div class="d-flex gap-2">
            <button type="submit" class="btn btn-primary">🔍 搜尋</button>
            <a href="{{ url_for('index') }}" class="btn btn-secondary">返回首頁</a>
        </div>
    </form>
</div>

{% endblock %}
