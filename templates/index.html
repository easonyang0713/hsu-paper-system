<!DOCTYPE html>
<html lang="zh-Hant">
{% extends "base.html" %}
<head>
    <meta charset="UTF-8">
    <title>許學仁榮譽教授紀念研究室 論文館藏系統</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

{% block content %}
    <div class="container py-5">
        <h1 class="text-center mb-4">📚許學仁榮譽教授紀念研究室 論文館藏系統📚</h1>

        <div class="card shadow-sm p-4">
            <form action="/search" method="get">
                <div class="row g-3 align-items-center">
                    <div class="col-md-6">
                        <label for="keyword" class="form-label">🔍 關鍵字：</label>
                        <input type="text" class="form-control" name="keyword" id="keyword" placeholder="請輸入關鍵字" required>
                    </div>
                    <div class="col-md-4">
                        <label for="scope" class="form-label">搜尋範圍：</label>
                        <select name="scope" id="scope" class="form-select">
                            <option value="all">全部欄位</option>
                            <option value="title">標題</option>
                            <option value="authors">作者</option>
                            <option value="source">出處</option>
                        </select>
                    </div>
                    <div class="col-md-2 d-grid">
                        <label class="form-label invisible">搜尋</label>
                        <button type="submit" class="btn btn-primary">開始搜尋</button>
                    </div>
                </div>
            </form>
        </div>

        <div class="text-center mt-4">
            <a href="/search/advanced" class="btn btn-outline-secondary">🔎 進階搜尋</a>

        </div>
		
    </div>
	{% endblock %}

</body>
</html>
